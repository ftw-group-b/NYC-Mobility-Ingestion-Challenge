resources:
  jobs:
    nyc_mobility_pipeline:
      name: NYC Mobility - Source to Gold
      description: >-
        Runs the approved ingestion, Bronze, Silver, and Gold notebooks in
        dependency order. Source inspection and analytics queries are excluded
        because they are documentation/exploration activities rather than
        operational pipeline steps.

      max_concurrent_runs: 1

      tasks:
        - task_key: ingestion
          notebook_task:
            notebook_path: ../notebooks/01_ingestion/01_ingestion.ipynb
            source: WORKSPACE

        - task_key: bronze_setup
          depends_on:
            - task_key: ingestion
          notebook_task:
            notebook_path: ../notebooks/02_bronze/02_bronze_setup.ipynb
            source: WORKSPACE

        - task_key: bronze_load
          depends_on:
            - task_key: bronze_setup
          notebook_task:
            notebook_path: ../notebooks/02_bronze/03_bronze_load.ipynb
            source: WORKSPACE

        - task_key: bronze_validation
          depends_on:
            - task_key: bronze_load
          notebook_task:
            notebook_path: ../notebooks/05_validation/04_bronze_validation.ipynb
            source: WORKSPACE

        # The three Silver source transformations can run independently after
        # Bronze validation succeeds.
        - task_key: silver_green_taxi
          depends_on:
            - task_key: bronze_validation
          notebook_task:
            notebook_path: ../notebooks/03_silver/01_silver_green_taxi.ipynb
            source: WORKSPACE

        - task_key: silver_taxi_zones
          depends_on:
            - task_key: bronze_validation
          notebook_task:
            notebook_path: ../notebooks/03_silver/02_silver_taxi_zones.ipynb
            source: WORKSPACE

        - task_key: silver_weather
          depends_on:
            - task_key: bronze_validation
          notebook_task:
            notebook_path: ../notebooks/03_silver/03_silver_weather.ipynb
            source: WORKSPACE

        - task_key: validate_silver_green_taxi
          depends_on:
            - task_key: silver_green_taxi
          notebook_task:
            notebook_path: ../notebooks/05_validation/silver_validation/01_silver_green_taxi_validation.ipynb
            source: WORKSPACE

        - task_key: validate_silver_taxi_zones
          depends_on:
            - task_key: silver_taxi_zones
          notebook_task:
            notebook_path: ../notebooks/05_validation/silver_validation/02_silver_taxi_zones_validation.ipynb
            source: WORKSPACE

        - task_key: validate_silver_weather
          depends_on:
            - task_key: silver_weather
          notebook_task:
            notebook_path: ../notebooks/05_validation/silver_validation/03_silver_weather_validation.ipynb
            source: WORKSPACE

        - task_key: gold_creation
          depends_on:
            - task_key: validate_silver_green_taxi
            - task_key: validate_silver_taxi_zones
            - task_key: validate_silver_weather
          notebook_task:
            notebook_path: ../notebooks/04_gold/04_gold_mart_creation.ipynb
            source: WORKSPACE

        - task_key: gold_validation
          depends_on:
            - task_key: gold_creation
          notebook_task:
            notebook_path: ../notebooks/05_validation/gold_validation/04_gold_mart_validation.ipynb
            source: WORKSPACE
