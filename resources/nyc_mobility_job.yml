resources:
  jobs:
    nyc_mobility_pipeline:
      name: NYC Mobility - End-to-End Pipeline
      description: >-
        Runs the approved incremental ingestion, Bronze, Silver, Gold,
        business analytics, data-quality monitoring, analytics validation,
        and consolidated quality gate in dependency order.

      max_concurrent_runs: 1

      tasks:
        - task_key: ingestion
          notebook_task:
            notebook_path: ../notebooks/01_ingestion/01_ingestion.ipynb
            source: WORKSPACE

        - task_key: bronze_setup
          depends_on:
            - task_key: ingestion
          notebook_task:
            notebook_path: ../notebooks/02_bronze/01_bronze_setup.ipynb
            source: WORKSPACE

        - task_key: bronze_load
          depends_on:
            - task_key: bronze_setup
          notebook_task:
            notebook_path: ../notebooks/02_bronze/02_bronze_load.ipynb
            source: WORKSPACE

        - task_key: bronze_validation
          depends_on:
            - task_key: bronze_load
          notebook_task:
            notebook_path: ../tests/bronze/01_bronze_validation.ipynb
            source: WORKSPACE

        - task_key: silver_green_taxi
          depends_on:
            - task_key: bronze_validation
          notebook_task:
            notebook_path: ../notebooks/03_silver/01_silver_green_taxi.ipynb
            source: WORKSPACE

        - task_key: silver_taxi_zones
          depends_on:
            - task_key: bronze_validation
          notebook_task:
            notebook_path: ../notebooks/03_silver/02_silver_taxi_zones.ipynb
            source: WORKSPACE

        - task_key: silver_weather
          depends_on:
            - task_key: bronze_validation
          notebook_task:
            notebook_path: ../notebooks/03_silver/03_silver_weather.ipynb
            source: WORKSPACE

        - task_key: validate_silver_green_taxi
          depends_on:
            - task_key: silver_green_taxi
          notebook_task:
            notebook_path: ../tests/silver/01_green_taxi_validation.ipynb
            source: WORKSPACE

        - task_key: validate_silver_taxi_zones
          depends_on:
            - task_key: silver_taxi_zones
          notebook_task:
            notebook_path: ../tests/silver/02_taxi_zones_validation.ipynb
            source: WORKSPACE

        - task_key: validate_silver_weather
          depends_on:
            - task_key: silver_weather
          notebook_task:
            notebook_path: ../tests/silver/03_weather_validation.ipynb
            source: WORKSPACE

        - task_key: gold_creation
          depends_on:
            - task_key: validate_silver_green_taxi
            - task_key: validate_silver_taxi_zones
            - task_key: validate_silver_weather
          notebook_task:
            notebook_path: ../notebooks/04_gold/01_gold_mart_creation.ipynb
            source: WORKSPACE

        - task_key: gold_validation
          depends_on:
            - task_key: gold_creation
          notebook_task:
            notebook_path: ../tests/gold/01_gold_mart_validation.ipynb
            source: WORKSPACE

        - task_key: data_quality_views
          depends_on:
            - task_key: gold_validation
          notebook_task:
            notebook_path: ../notebooks/06_dashboard/01_data_quality_dashboard_views.ipynb
            source: WORKSPACE

        - task_key: business_analytics
          depends_on:
            - task_key: gold_validation
          notebook_task:
            notebook_path: ../notebooks/05_analytics/01_business_analytics.ipynb
            source: WORKSPACE

        - task_key: analytics_validation
          depends_on:
            - task_key: business_analytics
          notebook_task:
            notebook_path: ../tests/analytics/01_analytics_validation.ipynb
            source: WORKSPACE

        - task_key: consolidated_quality_gate
          depends_on:
            - task_key: data_quality_views
            - task_key: analytics_validation
          notebook_task:
            notebook_path: ../tests/end_to_end/02_great_expectations_quality_gate.ipynb
            source: WORKSPACE
          environment_key: gx_environment

      environments:
        - environment_key: gx_environment
          spec:
            environment_version: "2"
            dependencies:
              - great_expectations==1.23.1
