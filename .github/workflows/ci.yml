name: NYC Mobility CI Quality Gates

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
      - "docs/**"
      - "ci/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project:
    name: Validate NYC Mobility project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Check required project directories
        shell: bash
        run: |
          set -euo pipefail

          required_dirs=(
            "src"
            "notebooks"
            "tests"
            "docs"
            "dashboard"
          )

          for directory in "${required_dirs[@]}"; do
            if [[ ! -d "$directory" ]]; then
              echo "ERROR: Missing required directory: $directory"
              exit 1
            fi

            echo "PASS: Found $directory/"
          done

      - name: Check README
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s README.md ]]; then
            echo "ERROR: README.md is missing or empty"
            exit 1
          fi

          echo "PASS: README.md exists and is not empty"

      - name: Validate SQL files when present
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t sql_files < <(
            find src tests -type f -name "*.sql" | sort
          )

          if [[ "${#sql_files[@]}" -eq 0 ]]; then
            echo "INFO: No SQL files committed yet"
            exit 0
          fi

          for file in "${sql_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "ERROR: SQL file is empty: $file"
              exit 1
            fi

            echo "PASS: $file"
          done

      - name: Validate Python files when present
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t python_files < <(
            find src tests/unit -type f -name "*.py" | sort
          )

          if [[ "${#python_files[@]}" -eq 0 ]]; then
            echo "INFO: No Python files committed yet"
            exit 0
          fi

          python -m py_compile "${python_files[@]}"

          echo "PASS: Python syntax validation completed"

      - name: Run unit and source-notebook alignment tests
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest discover \
            --start-directory tests/unit \
            --pattern "test_*.py" \
            --verbose

      - name: Validate Databricks notebooks when present
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t notebook_files < <(
            find notebooks tests -type f -name "*.ipynb" | sort
          )

          if [[ "${#notebook_files[@]}" -eq 0 ]]; then
            echo "INFO: No Databricks notebooks committed"
            exit 0
          fi

          python - <<'PY'
          import ast
          import json
          import pathlib
          import sys

          notebooks = [
              *pathlib.Path("notebooks").rglob("*.ipynb"),
              *pathlib.Path("tests").rglob("*.ipynb"),
          ]

          failed = False

          for path in sorted(notebooks):
              try:
                  with path.open(encoding="utf-8") as f:
                      notebook = json.load(f)

                  required_fields = {
                      "cells",
                      "metadata",
                      "nbformat",
                      "nbformat_minor",
                  }

                  missing = required_fields - notebook.keys()

                  if missing:
                      print(
                          f"ERROR: {path} is missing: "
                          f"{', '.join(sorted(missing))}"
                      )
                      failed = True
                      continue

                  for index, cell in enumerate(notebook["cells"]):
                      source = "".join(cell.get("source", []))
                      if not source.startswith("%python"):
                          continue

                      python_source = source.split("\n", 1)[1]
                      try:
                          ast.parse(python_source, filename=str(path))
                      except SyntaxError as exc:
                          print(
                              f"ERROR: Python syntax in {path}, "
                              f"cell {index}: {exc}"
                          )
                          failed = True

                  print(f"PASS: {path}")

              except (json.JSONDecodeError, UnicodeDecodeError) as exc:
                  print(f"ERROR: Invalid notebook {path}: {exc}")
                  failed = True

          if failed:
              sys.exit(1)
          PY

          echo "PASS: Databricks notebook validation completed"

      - name: Prevent raw Parquet files from entering Git
        shell: bash
        run: |
          set -euo pipefail

          parquet_files=$(git ls-files "*.parquet")

          if [[ -n "$parquet_files" ]]; then
            echo "ERROR: Raw Parquet files should remain in R2, not GitHub"
            echo "$parquet_files"
            exit 1
          fi

          echo "PASS: No Parquet source files tracked"
