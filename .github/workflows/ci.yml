name: NYC Mobility CI Quality Gates

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
      - "docs/**"
      - "ci/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project:
    name: Validate NYC Mobility project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required project directories
        shell: bash
        run: |
          set -euo pipefail

          required_dirs=(
            "src"
            "notebooks"
            "tests"
            "docs"
            "dashboard"
          )

          for directory in "${required_dirs[@]}"; do
            if [[ ! -d "$directory" ]]; then
              echo "ERROR: Missing required directory: $directory"
              exit 1
            fi

            echo "PASS: Found $directory/"
          done

      - name: Check README
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s README.md ]]; then
            echo "ERROR: README.md is missing or empty"
            exit 1
          fi

          echo "PASS: README.md exists and is not empty"

      - name: Check Great Expectations runbook
        shell: bash
        run: |
          set -euo pipefail

          runbook="docs/data_quality/great_expectations_runbook.md"

          if [[ ! -s "$runbook" ]]; then
            echo "ERROR: Missing or empty Great Expectations runbook: $runbook"
            exit 1
          fi

          required_sections=(
            "Databricks"
            "Expectation Suite"
            "Validation Definition"
            "CI/CD"
            "Definition of done"
          )

          for section in "${required_sections[@]}"; do
            if ! grep -Fq "$section" "$runbook"; then
              echo "ERROR: Runbook is missing required topic: $section"
              exit 1
            fi
          done

          echo "PASS: Great Expectations runbook is present and contains required topics"

      - name: Validate GX assets when present
        shell: bash
        run: |
          set -euo pipefail

          gx_paths=()

          if [[ -d "gx" ]]; then
            gx_paths+=("gx")
          fi

          if [[ -d "tests/data_quality" ]]; then
            gx_paths+=("tests/data_quality")
          fi

          if [[ "${#gx_paths[@]}" -eq 0 ]]; then
            echo "INFO: No GX implementation assets committed yet"
            exit 0
          fi

          while IFS= read -r -d '' file; do
            if [[ ! -s "$file" ]]; then
              echo "ERROR: Empty GX asset: $file"
              exit 1
            fi
          done < <(find "${gx_paths[@]}" -type f \( -name "*.py" -o -name "*.yml" -o -name "*.yaml" -o -name "*.json" -o -name "*.ipynb" \) -print0)

          echo "PASS: GX implementation assets are non-empty"

      - name: Validate SQL files when present
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t sql_files < <(find src tests -type f -name "*.sql" | sort)

          if [[ "${#sql_files[@]}" -eq 0 ]]; then
            echo "INFO: No SQL files committed yet"
            exit 0
          fi

          for file in "${sql_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "ERROR: SQL file is empty: $file"
              exit 1
            fi

            echo "PASS: $file"
          done

      - name: Validate Python files when present
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t python_files < <(
            find src notebooks tests -type f -name "*.py" | sort
          )

          if [[ "${#python_files[@]}" -eq 0 ]]; then
            echo "INFO: No Python files committed yet"
            exit 0
          fi

          python -m py_compile "${python_files[@]}"

          echo "PASS: Python syntax validation completed"

      - name: Prevent raw Parquet files from entering Git
        shell: bash
        run: |
          set -euo pipefail

          parquet_files=$(git ls-files "*.parquet")

          if [[ -n "$parquet_files" ]]; then
            echo "ERROR: Raw Parquet files should remain in R2, not GitHub"
            echo "$parquet_files"
            exit 1
          fi

          echo "PASS: No Parquet source files tracked"
