name: CD - Deploy NYC Mobility to Databricks

on:
  push:
    branches:
      - main
    paths:
      - databricks.yml
      - resources/**
      - notebooks/**
      - src/**
      - tests/**
      - dashboard/**
      - .github/workflows/deploy-databricks.yml

  workflow_dispatch:
    inputs:
      run_pipeline:
        description: Run the Source-to-Gold job after deployment
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nyc-mobility-databricks-prod
  cancel-in-progress: false

env:
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  BUNDLE_VAR_alert_email: ${{ vars.DATABRICKS_ALERT_EMAIL }}
  BUNDLE_VAR_warehouse_id: ${{ vars.DATABRICKS_WAREHOUSE_ID }}

jobs:
  deploy:
    name: Validate and deploy Databricks bundle
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.DATABRICKS_HOST }}

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Check required GitHub configuration
        shell: bash
        run: |
          if [ -z "${DATABRICKS_HOST:-}" ]; then
            echo "Missing GitHub environment variable: DATABRICKS_HOST"
            exit 1
          fi

          if [ -z "${DATABRICKS_TOKEN:-}" ]; then
            echo "Missing GitHub environment secret: DATABRICKS_TOKEN"
            exit 1
          fi

          if [ -z "${BUNDLE_VAR_alert_email:-}" ]; then
            echo "Missing GitHub environment variable: DATABRICKS_ALERT_EMAIL"
            exit 1
          fi

          if [ -z "${BUNDLE_VAR_warehouse_id:-}" ]; then
            echo "Missing GitHub environment variable: DATABRICKS_WAREHOUSE_ID"
            exit 1
          fi

      - name: Install Databricks CLI
        uses: databricks/setup-cli@8821c27b1fe57472264eeb6e50c1f31d69552f28
        with:
          version: 1.10.0

      - name: Validate bundle
        run: databricks bundle validate -t prod

      - name: Deploy bundle
        run: databricks bundle deploy -t prod

      - name: Show deployed Databricks resources
        shell: bash
        run: |
          SUMMARY="$(databricks bundle summary -t prod)"
          printf '%s\n' "$SUMMARY"

          {
            echo "## Deployed Databricks resources"
            printf '%s\n' "$SUMMARY" | sed -E 's/^[[:space:]]+//'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Source-to-Gold pipeline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_pipeline }}
        run: databricks bundle run -t prod nyc_mobility_pipeline
