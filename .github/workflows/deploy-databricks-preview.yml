name: Deploy PR Preview to Databricks

on:
  pull_request:
    branches:
      - main
    paths:
      - databricks.yml
      - resources/**
      - notebooks/**
      - src/**
      - tests/**
      - dashboards/**
      - .github/workflows/deploy-databricks-preview.yml

permissions:
  contents: read
  deployments: write

concurrency:
  group: databricks-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  BUNDLE_VAR_alert_email: ${{ vars.DATABRICKS_ALERT_EMAIL }}
  BUNDLE_VAR_warehouse_id: ${{ vars.DATABRICKS_WAREHOUSE_ID }}

jobs:
  deploy-preview:
    name: Deploy PR to Databricks development
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    environment:
      name: development
      url: ${{ vars.DATABRICKS_HOST }}

    steps:
      - name: Check out PR branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Check required configuration
        shell: bash
        run: |
          if [ -z "${DATABRICKS_HOST:-}" ]; then
            echo "Missing GitHub environment variable: DATABRICKS_HOST"
            exit 1
          fi

          if [ -z "${DATABRICKS_TOKEN:-}" ]; then
            echo "Missing GitHub environment secret: DATABRICKS_TOKEN"
            exit 1
          fi

          if [ -z "${BUNDLE_VAR_alert_email:-}" ]; then
            echo "Missing GitHub environment variable: DATABRICKS_ALERT_EMAIL"
            exit 1
          fi

          if [ -z "${BUNDLE_VAR_warehouse_id:-}" ]; then
            echo "Missing GitHub environment variable: DATABRICKS_WAREHOUSE_ID"
            exit 1
          fi

      - name: Install Databricks CLI
        uses: databricks/setup-cli@8821c27b1fe57472264eeb6e50c1f31d69552f28
        with:
          version: 1.10.0

      - name: Validate development bundle
        run: databricks bundle validate -t dev

      - name: Deploy development bundle
        run: databricks bundle deploy -t dev
