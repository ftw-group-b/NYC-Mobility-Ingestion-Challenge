bundle:
  name: nyc-mobility-ingestion-challenge
  databricks_cli_version: ">= 1.10.0"

include:
  - resources/*.yml

sync:
  include:
    - notebooks/**/*.ipynb
    - src/**/*.sql
    - src/**/*.py
    - tests/**/*.ipynb

variables:
  alert_email:
    description: Email address for failed pipeline notifications

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/NYC-Mobility-Ingestion-Challenge/.bundle/${bundle.target}
