bundle:
  name: nyc-mobility-ingestion-challenge
  databricks_cli_version: ">= 0.218.0"

include:
  - resources/*.yml

sync:
  include:
    - notebooks/**/*.ipynb
    - src/**/*.sql
    - src/**/*.py
    - tests/**/*.ipynb

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-726a6b36-d03f.cloud.databricks.com/browse/folders/workspace?o=7474643791105769
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    workspace:
      root_path: /Workspace/Shared/NYC-Mobility-Ingestion-Challenge/.bundle/${bundle.target}
