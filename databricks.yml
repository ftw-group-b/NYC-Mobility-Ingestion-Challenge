bundle:
  name: nyc-mobility-ingestion-challenge

databricks_cli_version: ">= 0.218.0"

include:
  - resources/*.yml

# The cluster ID is supplied by GitHub Actions from the repository variable
# DATABRICKS_CLUSTER_ID. It is intentionally not committed to the repository.
variables:
  cluster_id:
    description: Existing Databricks cluster ID used by every pipeline task.

sync:
  include:
    - notebooks/**/*.ipynb

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
