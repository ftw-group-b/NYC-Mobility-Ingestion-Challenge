bundle:
  name: nyc-mobility-ingestion-challenge
  databricks_cli_version: ">= 0.218.0"

include:
  - resources/*.yml

sync:
  include:
    - notebooks/**/*.ipynb

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    workspace:
      root_path: /Workspace/Shared/NYC-Mobility-Ingestion-Challenge/.bundle/${bundle.target}
