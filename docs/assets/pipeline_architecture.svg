<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">NYC Mobility end-to-end Databricks pipeline</title>
  <desc id="desc">Incremental source ingestion flows through Bronze, validated Silver branches, Gold, data-quality and analytics products, validation, a consolidated quality gate, and two dashboards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#18354f" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#52687a"/>
    </marker>
    <style>
      .title{font:700 42px Inter,Arial,sans-serif;fill:#15324a}.subtitle{font:400 20px Inter,Arial,sans-serif;fill:#52687a}
      .lane{font:700 17px Inter,Arial,sans-serif;letter-spacing:1.5px;fill:#496174}.box-title{font:700 18px Inter,Arial,sans-serif;fill:#15324a}
      .box-copy{font:400 14px Inter,Arial,sans-serif;fill:#52687a}.small{font:600 13px Inter,Arial,sans-serif;fill:#52687a}
      .edge{fill:none;stroke:#52687a;stroke-width:3;marker-end:url(#arrow)}.edge-dash{fill:none;stroke:#7890a2;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="url(#bg)"/>
  <rect x="42" y="36" width="1716" height="1048" rx="28" fill="#ffffff" stroke="#d8e3ec" stroke-width="2"/>
  <text x="90" y="100" class="title">NYC Mobility — Databricks Lakehouse Pipeline</text>
  <text x="90" y="137" class="subtitle">Incremental ingestion • medallion architecture • independent validation • dashboard-ready Gold products</text>

  <text x="90" y="202" class="lane">SOURCES</text>
  <text x="370" y="202" class="lane">INGEST &amp; BRONZE</text>
  <text x="790" y="202" class="lane">SILVER</text>
  <text x="1125" y="202" class="lane">GOLD</text>
  <text x="1445" y="202" class="lane">SERVE &amp; ASSURE</text>
  <line x1="90" y1="220" x2="1710" y2="220" stroke="#d8e3ec" stroke-width="2"/>

  <!-- Sources -->
  <g filter="url(#shadow)">
    <rect x="85" y="270" width="220" height="105" rx="16" fill="#e8f3ff" stroke="#5d9be6" stroke-width="2"/>
    <rect x="85" y="410" width="220" height="105" rx="16" fill="#e8f3ff" stroke="#5d9be6" stroke-width="2"/>
    <rect x="85" y="550" width="220" height="105" rx="16" fill="#e8f3ff" stroke="#5d9be6" stroke-width="2"/>
  </g>
  <text x="110" y="310" class="box-title">NYC Green Taxi</text><text x="110" y="337" class="box-copy">Monthly Parquet</text><text x="110" y="359" class="box-copy">March–May 2026</text>
  <text x="110" y="450" class="box-title">Taxi Zones</text><text x="110" y="477" class="box-copy">TLC lookup CSV</text><text x="110" y="499" class="box-copy">Location reference</text>
  <text x="110" y="590" class="box-title">Open-Meteo</text><text x="110" y="617" class="box-copy">Hourly JSON arrays</text><text x="110" y="639" class="box-copy">NYC weather context</text>

  <!-- Ingest/Bronze -->
  <g filter="url(#shadow)">
    <rect x="365" y="286" width="315" height="94" rx="16" fill="#fff3df" stroke="#e2a33b" stroke-width="2"/>
    <rect x="365" y="432" width="315" height="94" rx="16" fill="#fff3df" stroke="#e2a33b" stroke-width="2"/>
    <rect x="365" y="578" width="315" height="94" rx="16" fill="#fff3df" stroke="#e2a33b" stroke-width="2"/>
  </g>
  <text x="390" y="321" class="box-title">Incremental ingestion</text><text x="390" y="348" class="box-copy">Idempotent file acquisition and landing</text>
  <text x="390" y="467" class="box-title">Bronze setup + load</text><text x="390" y="494" class="box-copy">Raw fidelity with source lineage</text>
  <text x="390" y="613" class="box-title">Bronze validation</text><text x="390" y="640" class="box-copy">Schema, volume, provenance, rerun safety</text>

  <!-- Silver branches -->
  <g filter="url(#shadow)">
    <rect x="770" y="258" width="285" height="112" rx="16" fill="#edf7f1" stroke="#43a66f" stroke-width="2"/>
    <rect x="770" y="430" width="285" height="112" rx="16" fill="#edf7f1" stroke="#43a66f" stroke-width="2"/>
    <rect x="770" y="602" width="285" height="112" rx="16" fill="#edf7f1" stroke="#43a66f" stroke-width="2"/>
  </g>
  <text x="795" y="292" class="box-title">Silver Green Taxi</text><text x="795" y="319" class="box-copy">Typed trips + DQ flags</text><text x="795" y="344" class="small">✓ Separate validation</text>
  <text x="795" y="464" class="box-title">Silver Taxi Zones</text><text x="795" y="491" class="box-copy">Trusted LocationID lookup</text><text x="795" y="516" class="small">✓ Separate validation</text>
  <text x="795" y="636" class="box-title">Silver Weather</text><text x="795" y="663" class="box-copy">One row per local source hour</text><text x="795" y="688" class="small">✓ Separate validation</text>

  <!-- Gold -->
  <g filter="url(#shadow)">
    <rect x="1125" y="330" width="270" height="126" rx="16" fill="#f2edff" stroke="#8564d8" stroke-width="2"/>
    <rect x="1125" y="502" width="270" height="106" rx="16" fill="#f2edff" stroke="#8564d8" stroke-width="2"/>
  </g>
  <text x="1150" y="367" class="box-title">Gold star schema</text><text x="1150" y="396" class="box-copy">Trip fact + Date, Time,</text><text x="1150" y="419" class="box-copy">Taxi Zone, Weather dimensions</text>
  <text x="1150" y="539" class="box-title">Gold validation</text><text x="1150" y="566" class="box-copy">Keys, measures, FKs, joins, rerun</text><text x="1150" y="590" class="small">✓ Technical gate</text>

  <!-- Serving -->
  <g filter="url(#shadow)">
    <rect x="1450" y="250" width="270" height="112" rx="16" fill="#e9fbfb" stroke="#20a6a6" stroke-width="2"/>
    <rect x="1450" y="400" width="270" height="112" rx="16" fill="#e9fbfb" stroke="#20a6a6" stroke-width="2"/>
    <rect x="1450" y="550" width="270" height="112" rx="16" fill="#fff0f5" stroke="#d65a89" stroke-width="2"/>
    <rect x="1450" y="710" width="270" height="126" rx="16" fill="#fff7dd" stroke="#d3a824" stroke-width="3"/>
  </g>
  <text x="1475" y="285" class="box-title">Data-quality views</text><text x="1475" y="312" class="box-copy">Seven-attribute monitoring</text><text x="1475" y="337" class="small">→ Data Quality Dashboard</text>
  <text x="1475" y="435" class="box-title">Business analytics</text><text x="1475" y="462" class="box-copy">Demand • Weather • Areas</text><text x="1475" y="487" class="small">→ Business Analytics Dashboard</text>
  <text x="1475" y="585" class="box-title">Analytics validation</text><text x="1475" y="612" class="box-copy">Grains, clock hours, reconciliation</text><text x="1475" y="637" class="small">✓ Independent analytics checks</text>
  <text x="1475" y="747" class="box-title">Consolidated quality gate</text><text x="1475" y="778" class="box-copy">All layers + all products</text><text x="1475" y="806" style="font:800 20px Inter,Arial,sans-serif;fill:#946d00">OVERALL PASS / FAIL</text>

  <!-- Main connectors -->
  <path class="edge" d="M305 322 H365"/><path class="edge" d="M305 462 H335 V333 H365"/><path class="edge" d="M305 602 H335 V333 H365"/>
  <path class="edge" d="M522 380 V432"/><path class="edge" d="M522 526 V578"/>
  <path class="edge" d="M680 625 H725 V314 H770"/><path class="edge" d="M725 486 H770"/><path class="edge" d="M725 658 H770"/>
  <path class="edge" d="M1055 314 H1090 V393 H1125"/><path class="edge" d="M1055 486 H1090 V393 H1125"/><path class="edge" d="M1055 658 H1090 V393 H1125"/>
  <path class="edge" d="M1260 456 V502"/>
  <path class="edge" d="M1395 555 H1420 V306 H1450"/><path class="edge" d="M1420 456 H1450"/>
  <path class="edge" d="M1585 512 V550"/>
  <path class="edge" d="M1585 662 V710"/>
  <path class="edge" d="M1450 306 H1425 V773 H1450"/>

  <!-- Governance footer -->
  <rect x="85" y="900" width="1635" height="118" rx="18" fill="#15324a"/>
  <text x="120" y="943" style="font:700 19px Inter,Arial,sans-serif;fill:#ffffff">Cross-cutting controls</text>
  <text x="120" y="980" style="font:400 16px Inter,Arial,sans-serif;fill:#d8e6ef">Source lineage • deterministic keys • incremental idempotency • row/measure reconciliation • FK and join-cardinality checks • GitHub CI/CD • Databricks Asset Bundle</text>
  <text x="120" y="1007" style="font:400 14px Inter,Arial,sans-serif;fill:#9ec2d8">No dbt: transformations, views, validations, and orchestration are implemented directly in Databricks.</text>
</svg>
