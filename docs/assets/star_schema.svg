<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
  <title id="title">NYC Mobility Gold star schema</title>
  <desc id="desc">One Green Taxi source record per fact row joined to Date, Time, Taxi Zone, and Weather Hour dimensions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3f8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#18354f" flood-opacity="0.14"/></filter>
    <style>
      .title{font:700 42px Inter,Arial,sans-serif;fill:#15324a}.subtitle{font:400 20px Inter,Arial,sans-serif;fill:#52687a}
      .th{font:700 19px Inter,Arial,sans-serif;fill:white}.field{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#263f53}.type{font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#667d8f}
      .key{font:800 12px Inter,Arial,sans-serif}.grain{font:600 12px Inter,Arial,sans-serif;fill:white}.rel{fill:none;stroke-width:4}.note{font:600 14px Inter,Arial,sans-serif;fill:#52687a}
    </style>
  </defs>
  <rect width="1800" height="1220" fill="url(#bg)"/><rect x="42" y="36" width="1716" height="1148" rx="28" fill="#fff" stroke="#d8e3ec" stroke-width="2"/>
  <text x="90" y="100" class="title">NYC Mobility — Gold Star Schema</text>
  <text x="90" y="137" class="subtitle">Fact grain: one accepted Silver Green Taxi source record • role-playing Date, Time, and Taxi Zone dimensions</text>

  <!-- relationship lines behind tables -->
  <path d="M620 380 H520 V336 H565" class="rel" stroke="#00a99d"/><path d="M620 420 H500 V336 H565" class="rel" stroke="#00a99d"/>
  <path d="M1180 388 H1280 V336 H1235" class="rel" stroke="#f28e2b"/><path d="M1180 428 H1300 V336 H1235" class="rel" stroke="#f28e2b"/>
  <path d="M620 500 H500 V846 H565" class="rel" stroke="#cc4ca8"/><path d="M620 540 H520 V846 H565" class="rel" stroke="#cc4ca8"/>
  <path d="M1180 508 H1300 V846 H1235" class="rel" stroke="#e05252"/>

  <!-- Dim Date -->
  <g filter="url(#shadow)"><rect x="90" y="200" width="475" height="330" rx="15" fill="#f2fffd" stroke="#00a99d" stroke-width="2"/><path d="M90 215 Q90 200 105 200 H550 Q565 200 565 215 V252 H90Z" fill="#00a99d"/></g>
  <text x="115" y="234" class="th">DIM_DATE</text><text x="420" y="234" class="grain">one calendar date</text>
  <text x="115" y="282" class="key" fill="#008b82">PK</text><text x="160" y="282" class="field">date_key</text><text x="445" y="282" class="type">INT</text>
  <text x="160" y="314" class="field">full_date</text><text x="445" y="314" class="type">DATE</text>
  <text x="160" y="346" class="field">year, quarter</text><text x="445" y="346" class="type">INT</text>
  <text x="160" y="378" class="field">month_number, month_name</text><text x="445" y="378" class="type">INT, STRING</text>
  <text x="160" y="410" class="field">day_of_month, day_of_week</text><text x="445" y="410" class="type">INT</text>
  <text x="160" y="442" class="field">day_name</text><text x="445" y="442" class="type">STRING</text>
  <text x="160" y="474" class="field">is_weekend</text><text x="445" y="474" class="type">BOOLEAN</text>
  <text x="160" y="506" class="field">is_holiday</text><text x="445" y="506" class="type">BOOLEAN?</text>

  <!-- Dim Time -->
  <g filter="url(#shadow)"><rect x="1235" y="200" width="475" height="260" rx="15" fill="#fff8ed" stroke="#f28e2b" stroke-width="2"/><path d="M1235 215 Q1235 200 1250 200 H1695 Q1710 200 1710 215 V252 H1235Z" fill="#f28e2b"/></g>
  <text x="1260" y="234" class="th">DIM_TIME</text><text x="1580" y="234" class="grain">one clock hour</text>
  <text x="1260" y="282" class="key" fill="#c66b11">PK</text><text x="1305" y="282" class="field">time_key</text><text x="1590" y="282" class="type">INT</text>
  <text x="1305" y="318" class="field">hour_24</text><text x="1590" y="318" class="type">INT</text>
  <text x="1305" y="354" class="field">hour_label</text><text x="1590" y="354" class="type">STRING</text>
  <text x="1305" y="390" class="field">day_period</text><text x="1590" y="390" class="type">STRING</text>
  <text x="1305" y="430" class="note">0 = Unknown • 1–24 = 00:00–23:00</text>

  <!-- Fact -->
  <g filter="url(#shadow)"><rect x="620" y="200" width="560" height="820" rx="15" fill="#f5f9ff" stroke="#3478c7" stroke-width="3"/><path d="M620 215 Q620 200 635 200 H1165 Q1180 200 1180 215 V252 H620Z" fill="#3478c7"/></g>
  <text x="645" y="234" class="th">FACT_GREEN_TAXI_TRIP</text><text x="1035" y="234" class="grain">one source trip row</text>
  <text x="645" y="282" class="key" fill="#2465ad">PK</text><text x="690" y="282" class="field">trip_key</text><text x="1060" y="282" class="type">BIGINT</text>
  <text x="690" y="318" class="field">vendor_id</text><text x="1060" y="318" class="type">BIGINT</text>
  <text x="645" y="356" class="key" fill="#008b82">FK</text><text x="690" y="356" class="field">pickup_date_key</text><text x="1060" y="356" class="type">INT</text>
  <text x="645" y="396" class="key" fill="#008b82">FK</text><text x="690" y="396" class="field">dropoff_date_key</text><text x="1060" y="396" class="type">INT</text>
  <text x="645" y="436" class="key" fill="#c66b11">FK</text><text x="690" y="436" class="field">pickup_time_key</text><text x="1060" y="436" class="type">INT</text>
  <text x="645" y="476" class="key" fill="#c66b11">FK</text><text x="690" y="476" class="field">dropoff_time_key</text><text x="1060" y="476" class="type">INT</text>
  <text x="645" y="516" class="key" fill="#af2b8c">FK</text><text x="690" y="516" class="field">pickup_taxi_zone_key</text><text x="1060" y="516" class="type">INT</text>
  <text x="645" y="556" class="key" fill="#af2b8c">FK</text><text x="690" y="556" class="field">dropoff_taxi_zone_key</text><text x="1060" y="556" class="type">INT</text>
  <text x="645" y="596" class="key" fill="#c13b3b">FK</text><text x="690" y="596" class="field">pickup_weather_hour_key</text><text x="1060" y="596" class="type">BIGINT</text>
  <line x1="645" y1="620" x2="1155" y2="620" stroke="#d2dfeb"/>
  <text x="690" y="650" class="field">pickup_datetime, dropoff_datetime</text><text x="1060" y="650" class="type">TIMESTAMP_NTZ</text>
  <text x="690" y="686" class="field">trip_count, passenger_count</text><text x="1060" y="686" class="type">BIGINT, INT</text>
  <text x="690" y="722" class="field">distance, duration, avg_speed</text><text x="1060" y="722" class="type">DOUBLE</text>
  <text x="690" y="758" class="field">fare, tip, tolls, total + components</text><text x="1060" y="758" class="type">DOUBLE</text>
  <text x="690" y="794" class="field">rate/payment/trip categorical fields</text><text x="1060" y="794" class="type">INT/STRING</text>
  <text x="690" y="830" class="field">dq_* analytical quality flags</text><text x="1060" y="830" class="type">BOOLEAN</text>
  <text x="690" y="866" class="field">source_system, source_file, batch_id</text><text x="1060" y="866" class="type">STRING</text>
  <text x="690" y="902" class="note">Technical key is repeatable, not a TLC-issued trip ID.</text>
  <rect x="650" y="938" width="500" height="52" rx="10" fill="#e7f1ff"/><text x="675" y="970" class="note">DQ flags preserve rows; analytics views define reporting scope.</text>

  <!-- Dim Zone -->
  <g filter="url(#shadow)"><rect x="90" y="700" width="475" height="300" rx="15" fill="#fff0fb" stroke="#cc4ca8" stroke-width="2"/><path d="M90 715 Q90 700 105 700 H550 Q565 700 565 715 V752 H90Z" fill="#cc4ca8"/></g>
  <text x="115" y="734" class="th">DIM_TAXI_ZONE</text><text x="425" y="734" class="grain">one LocationID</text>
  <text x="115" y="782" class="key" fill="#af2b8c">PK</text><text x="160" y="782" class="field">taxi_zone_key</text><text x="445" y="782" class="type">INT</text>
  <text x="160" y="824" class="field">location_id</text><text x="445" y="824" class="type">INT</text>
  <text x="160" y="866" class="field">borough</text><text x="445" y="866" class="type">STRING</text>
  <text x="160" y="908" class="field">zone_name</text><text x="445" y="908" class="type">STRING</text>
  <text x="160" y="950" class="field">service_zone</text><text x="445" y="950" class="type">STRING</text>

  <!-- Dim Weather -->
  <g filter="url(#shadow)"><rect x="1235" y="590" width="475" height="500" rx="15" fill="#fff2f2" stroke="#e05252" stroke-width="2"/><path d="M1235 605 Q1235 590 1250 590 H1695 Q1710 590 1710 605 V642 H1235Z" fill="#e05252"/></g>
  <text x="1260" y="624" class="th">DIM_WEATHER_HOUR</text><text x="1575" y="624" class="grain">one NYC local hour</text>
  <text x="1260" y="674" class="key" fill="#c13b3b">PK</text><text x="1305" y="674" class="field">weather_hour_key</text><text x="1590" y="674" class="type">BIGINT</text>
  <text x="1305" y="710" class="field">weather_timestamp_local</text><text x="1590" y="710" class="type">TIMESTAMP_NTZ</text>
  <text x="1305" y="746" class="field">temperature_2m</text><text x="1590" y="746" class="type">DOUBLE</text>
  <text x="1305" y="782" class="field">precipitation, rain, snowfall</text><text x="1590" y="782" class="type">DOUBLE</text>
  <text x="1305" y="818" class="field">weather_code</text><text x="1590" y="818" class="type">BIGINT</text>
  <text x="1305" y="854" class="field">wind_speed_10m</text><text x="1590" y="854" class="type">DOUBLE</text>
  <text x="1305" y="890" class="field">timezone, utc_offset_seconds</text><text x="1590" y="890" class="type">STRING, BIGINT</text>
  <text x="1305" y="926" class="field">latitude, longitude</text><text x="1590" y="926" class="type">DOUBLE</text>
  <text x="1305" y="962" class="field">source_system, source_file</text><text x="1640" y="962" class="type">STRING</text>
  <text x="1305" y="998" class="field">batch_id</text><text x="1640" y="998" class="type">STRING</text>
  <text x="1305" y="1045" class="note">Key 0 is the governed Unknown weather member.</text>

  <rect x="90" y="1125" width="1620" height="36" rx="10" fill="#15324a"/>
  <text x="115" y="1149" style="font:600 14px Inter,Arial,sans-serif;fill:#d8e6ef">Role-playing joins: pickup/drop-off Date • pickup/drop-off Time • pickup/drop-off Taxi Zone • pickup Weather Hour</text>
</svg>
